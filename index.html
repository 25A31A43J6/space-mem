    <style>
      video, .background-video {
        position: fixed;
        inset: 0;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        border-radius: 0;
        pointer-events: none;
        background-color: transparent;
      }
      .video-overlay, .background-overlay {
        position: fixed;
        inset: 0;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
        z-index: 1;
        pointer-events: none;
      }
      .app-content {
        position: relative;
        z-index: 2;
      }
      .card, .glass-card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
